# /etc/pi-fortress/logrotate.conf — vm/pi/apply.sh installs it.
# Before this file existed, the logs of the gateway grew with no limit.
#
# On purpose NOT /etc/logrotate.d/pi-fortress. The Ubuntu logrotate.timer
# is daily and reads /etc/logrotate.d/*. Thus it examines a conf there only
# one time each day. That is too slow for the DNS query logs: on a busy
# segment they pass maxsize in hours, and they grow until the daily run
# sees them. pi-fortress-logrotate.timer (vm/pi/logrotate.timer)
# runs every 15 minutes over this file with its own state file,
# /var/lib/pi-fortress/logrotate.state. Thus the system run and our run never
# disagree about when a path was last rotated. Each run checks all of this
# file. The stanzas that say daily or hourly still rotate on time, at most
# that often. maxsize rotates a file each time that the file is past it,
# whatever the period says.
#
# Disk budget: logrotate examines maxsize only
# when the timer fires. Thus a file can go past it by the amount that is
# written in 15 minutes. A hostile agent can write the agent-driven broker
# files (strip, unknown, use) faster than that. For that reason, the
# writer has its own size ceiling as the hard stop. This file only changes
# what is below that ceiling into compressed history. Worst
# case per 50M stanza: one uncompressed .1 (delaycompress) at the size it
# got to, plus rotate-1 gzip files at about a tenth of 50M each.
#
# The process that holds the file open sets the rotation mode of each file:
#
#   * the jsonl writers (internal/jsonl, internal/audit, internal/observe)
#     open O_APPEND, write one line and close, so a
#     rename takes effect on the next line. No copytruncate.
#   * the readers reopen too. The bell sidecar (internal/alert) tails
#     through internal/tailer:
#     Drain() opens the path, reads from the byte offset saved in
#     /var/lib/pi-fortress/alert*.offset and closes again at each poll. pf
#     observe reads the dnsmasq logs the same way. Both bind the offset
#     to the inode where it was counted, and reset to 0 when the inode
#     changes. A rename causes that change.
#     The cost, stated clearly because it is easy to think the
#     opposite: neither reader follows the renamed file. Thus lines
#     written between the last poll of a reader and the rename are in
#     name.1, and nothing reads them. The loss is one poll interval at
#     most, not the rotation period. copytruncate is still
#     worse -- it loses all data that arrives between the copy and the
#     truncate, and it loses it from the file that the reader holds --
#     so rename is still the correct mode. Data that must survive
#     rotation exactly needs a reader that opens the rotated file, not
#     a different logrotate mode.
#   * the two dnsmasq instances and pf dns (internal/dnsd/log.go) do hold
#     their log fd open, so those get a signal instead: dnsmasq reopens
#     on SIGUSR2, pf dns on SIGHUP (Server.Reload).
#
# create uses the owner:group:mode that each file has now (apply.sh). Thus a
# rotation does not give a daemon a file that it cannot append to.
#
# /var/log/pi-fortress/monitor/*.jsonl is not here, on purpose: internal/monitor
# writes one file per UTC day, and itself prunes days older than seven.

/var/log/pi-fortress/strip.jsonl
/var/log/pi-fortress/unknown.jsonl
/var/log/pi-fortress/use.jsonl {
    daily
    rotate 14
    maxsize 50M
    compress
    delaycompress
    missingok
    notifempty
    create 0640 pf-broker pf-fortress
}

# observe runs as pf-observe, and cannot make a file in this directory.
# Thus the new file is its own.
/var/log/pi-fortress/observe.jsonl {
    daily
    rotate 14
    maxsize 50M
    compress
    delaycompress
    missingok
    notifempty
    create 0640 pf-observe pf-fortress
}

# The volume and dns_tunnel alerts of observe. pf alert tails them for the
# webhook. A small number of rows a week. pf alert follows a rename by inode.
/var/log/pi-fortress/notice.jsonl {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    create 0640 pf-observe pf-fortress
}

# The record of each signed ship from pf ship install, root, 0644. A small
# number of rows a week, but nothing else put a limit on it.
/var/log/pi-fortress/ship.jsonl {
    weekly
    rotate 8
    maxsize 10M
    compress
    delaycompress
    missingok
    notifempty
    create 0644 root root
}

# The process that runs pf admin writes it 0600. That process is root.
/var/log/pi-fortress/audit.jsonl {
    daily
    rotate 14
    maxsize 50M
    compress
    delaycompress
    missingok
    notifempty
    create 0600 root root
}

# The house DHCP log. It was in no stanza: the USR2 that dnsmasq gets below
# is for a rotation of files that pf dns owns, so this file only grew.
# create with no owner keeps the owner of the file, pf-dhcp-house. The
# daemon runs as that account from the start, and has no CAP_CHOWN to take
# back a file that root created.
/var/log/pi-fortress/dnsmasq-house-dhcp.log {
    daily
    rotate 14
    maxsize 50M
    compress
    delaycompress
    missingok
    notifempty
    create 0640
    postrotate
        systemctl kill -s USR2 pi-fortress-dns-house.service >/dev/null 2>&1 || true
    endscript
}

# The DHCP log of each plain segment with DHCP=on, one dnsmasq instance
# per segment (vm/pi/lib/dhcp.sh): the house stanza above, by glob. The
# names never match the house file, so no path is in two stanzas. Each
# instance has its own account (pf-dhcp-<name>). Thus create has no owner:
# each new file keeps the owner that its old file had.
/var/log/pi-fortress/dhcp-*.log {
    daily
    rotate 14
    maxsize 50M
    compress
    delaycompress
    missingok
    notifempty
    create 0640
    sharedscripts
    postrotate
        systemctl kill -s USR2 'pi-fortress-dhcp@*.service' >/dev/null 2>&1 || true
    endscript
}

# create with no owner keeps the current owner of the file. That is pf-dns:
# the resolver owns these files, and apply.sh chowns them, not this file.
# hourly, not daily: these are the files with the highest rate on the box,
# and the only files that the hourly timer exists for. Keep 48, so that two
# days of query history stay, as fourteen daily rotations gave a fortnight before.
/var/log/pi-fortress/dns.jsonl
/var/log/pi-fortress/dns-*.jsonl {
    hourly
    rotate 48
    maxsize 50M
    compress
    delaycompress
    missingok
    notifempty
    create
    sharedscripts
    postrotate
        systemctl kill -s USR2 pi-fortress-dns-agent.service >/dev/null 2>&1 || true
        systemctl kill -s USR2 pi-fortress-dns-house.service >/dev/null 2>&1 || true
        systemctl kill -s HUP pi-fortress-dns-agent-go.service >/dev/null 2>&1 || true
    endscript
}
